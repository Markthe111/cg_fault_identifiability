[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cg-fault-identifiability"
version = "0.1.0"
description = "Reproducible fault-domain identifiability diagnostics for claim-specific structural interpretation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Xie Fuyuan"},
  {name = "Chen Yuhua"},
  {name = "Yang Yongguo"},
  {name = "Luo Jinhui"},
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "statsmodels>=0.14,<1",
]
keywords = ["faults", "structural geology", "identifiability", "DSI", "Monte Carlo"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
dev = ["pytest>=8,<9", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
